replicaCount: 1

image:
  repository: ghcr.io/it-top-ai-bot/journal-service
  pullPolicy: IfNotPresent

ingress:
  enabled: false

config:
  springProfile: "prod,kubernetes"
  journal:
    baseUrl: "https://msapi.top-academy.ru/api/v2"
    syncInterval: "3600000"
  configServer:
    host: "config-server.infra.svc.cluster.local"
    port: "8080"
  otel:
    endpoint: "http://192.168.0.160:4318"

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    memory: "2Gi"

vault:
  secretPath: "prod/journal-service"
